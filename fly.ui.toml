# Web UI on Fly, behind password auth (UI_PASSWORD secret; the server refuses
# to bind publicly without it). Deploy with: fly deploy -c fly.ui.toml
app = "personalbase-ui"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.ui"

[env]
  HOST = "0.0.0.0"
  PORT = "4680"

[http_service]
  internal_port = 4680
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
