services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personalbase
      POSTGRES_USER: personalbase_admin
      POSTGRES_PASSWORD: personalbase-admin-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
